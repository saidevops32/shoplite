server.port=8080
spring.application.name=catalogue

# MySQL on Azure requires TLS. Host and password come from the container's environment.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/cataloguedb?sslMode=REQUIRED
spring.datasource.username=${MYSQL_USER:mysqladmin}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=60000

# Creates the table and loads the sample products at every start (safe to repeat).
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

server.error.include-message=never
server.error.include-stacktrace=never
