name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 1. Build and unit tests ----------
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Node services
        run: |
          for s in auth-service checkout-service notification-service; do
            (cd services/$s && npm ci --ignore-scripts && npm test)
          done
      - name: Web build
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Catalogue (Java) build
        working-directory: services/catalogue-service
        run: mvn -B -q package -DskipTests
      - uses: erlef/setup-beam@v1
        with: { otp-version: "26", rebar3-version: "3.23" }
      - name: Order worker (Erlang) compile
        working-directory: services/order-worker
        run: rebar3 compile

  # ---------- 2. Secret scanning ----------
  secrets-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.18.4 -c "git config --global --add safe.directory /repo && gitleaks detect --source /repo --verbose --redact"

  # ---------- 3. SAST ----------
  sast:
    name: SAST (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # ---------- 4. Dependencies, Dockerfiles and config ----------
  sca-iac:
    name: Dependencies, Dockerfile and config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (runtime packages only)
        run: |
          for d in services/auth-service services/checkout-service services/notification-service web; do
            (cd $d && npm audit --omit=dev --audit-level=high)
          done
      - name: Trivy filesystem scan (dependencies and secrets, including pom.xml)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.55.0 fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src
      - name: Trivy config scan (Dockerfile misconfigurations)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.55.0 config --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Hadolint (Dockerfile lint)
        run: |
          for f in services/*/Dockerfile web/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < $f
          done

  # ---------- 5. Build, scan, SBOM, push (six images) ----------
  build-scan-push:
    name: Image ${{ matrix.name }}
    needs: [test, secrets-scan, sast, sca-iac]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth, path: services/auth-service }
          - { name: catalogue, path: services/catalogue-service }
          - { name: checkout, path: services/checkout-service }
          - { name: notify, path: services/notification-service }
          - { name: worker, path: services/order-worker }
          - { name: web, path: web }
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t "$IMAGE" ./${{ matrix.path }}
      - name: Trivy image scan (fails on HIGH or CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.55.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.55.0 image --format cyclonedx --output /out/sbom-${{ matrix.name }}.json "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.json
      - name: Azure login (OIDC, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push to ACR
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker push "$IMAGE"

  # ---------- 6. Deploy ----------
  deploy:
    name: Deploy to Azure Container Apps
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        env:
          RG: ${{ vars.AZURE_RG }}
          ENV_NAME: ${{ vars.ACA_ENV }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          IDENTITY_ID: ${{ vars.IDENTITY_ID }}
          PG_HOST: ${{ vars.PG_HOST }}
          MYSQL_HOST: ${{ vars.MYSQL_HOST }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          RABBIT_PASSWORD: ${{ secrets.RABBIT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TAG: ${{ github.sha }}
        run: bash infra/deploy.sh

  # ---------- 7. Smoke test through the gateway (runs once the gateway exists) ----------
  smoke:
    name: Smoke test through the gateway
    needs: deploy
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test routing, login, order and payment
        run: bash infra/smoke.sh "${{ vars.APP_URL }}"

  # ---------- 8. DAST ----------
  dast:
    name: DAST (OWASP ZAP)
    needs: smoke
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: ZAP baseline scan against the live app
        run: |
          docker run --rm -u root -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "${{ vars.APP_URL }}" -r zap-report.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report.html

  # ---------- 9. Android app (runs once the gateway address is known) ----------
  mobile:
    name: Android APK
    needs: test
    if: github.event_name != 'pull_request' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create the Android project around our Dart code
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.shoplite --project-name shoplite .
          rm -f analysis_options.yaml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' $M
          grep -q 'permission.INTERNET' $M
          grep -q 'usesCleartextTraffic' $M
      - name: Analyze
        working-directory: mobile
        run: flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=API_BASE=${{ vars.APP_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: shoplite-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
