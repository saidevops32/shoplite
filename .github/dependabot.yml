version: 2
updates:
  - package-ecosystem: npm
    directory: /services/auth-service
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /services/checkout-service
    schedule: { interval: weekly }
    ignore:
